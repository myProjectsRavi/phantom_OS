name: Release provenance

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-release-artifacts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout full reachable history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch preserved pull request refs
        run: |
          git fetch --no-tags --force origin \
            '+refs/pull/*/head:refs/remotes/pull/*/head' \
            '+refs/pull/*/merge:refs/remotes/pull/*/merge'

      - name: Require release tag to be on main history
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip

      - name: Install build and verification tooling
        run: |
          python -m pip install --upgrade pip build
          pip install -e '.[dev]'

      - name: Verify release source
        run: |
          python scripts/check_public_snapshot.py
          python scripts/check_public_history.py
          python -m compileall -q src tests scripts benchmarks
          PYTHONPATH=src python -m ruff check src tests scripts benchmarks
          PYTHONPATH=src python -m ruff format --check src tests scripts benchmarks
          PYTHONPATH=src python -m mypy --ignore-missing-imports src/phantom
          PYTHONPATH=src python -m pytest -q --cov=phantom --cov-report=term-missing --cov-fail-under=95
          python -m pytest -q benchmarks/bench_tasks.py --benchmark-disable --no-cov
          python -m bandit -r src/phantom/ scripts/ -ll -ii -x '*/tests/*'
          python -m pip_audit --progress-spinner off

      - name: Build distributions
        run: python -m build

      - name: Verify built wheel
        shell: bash
        run: |
          python -m venv /tmp/phantom-release-wheel
          /tmp/phantom-release-wheel/bin/python -m pip install --upgrade pip
          /tmp/phantom-release-wheel/bin/pip install dist/*.whl
          /tmp/phantom-release-wheel/bin/phantom --help >/dev/null
          /tmp/phantom-release-wheel/bin/python -c 'from phantom.config import PhantomConfig; PhantomConfig()'

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Generate GitHub build provenance attestation
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload release build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phantomOS-${{ github.ref_name }}
          path: |
            dist/*
          if-no-files-found: error
