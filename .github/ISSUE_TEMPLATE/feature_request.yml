name: Feature request
description: Propose an enhancement for PhantomOS
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals public-safe. Do not include secrets, personal information, confidential employer/customer material, private architecture from another project, proprietary datasets, or sensitive logs/screenshots.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
      placeholder: Describe the pain point
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What behavior or API would you like?
      placeholder: Describe your proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds or alternatives you've tried
      placeholder: Optional
    validations:
      required: false
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who benefits and how?
      placeholder: Optional
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: This proposal contains no secrets, personal information, confidential material, or proprietary third-party data.
          required: true
