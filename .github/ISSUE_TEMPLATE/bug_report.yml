name: Bug report
description: Report an issue with PhantomOS behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please provide enough detail to reproduce.

        **Privacy:** Before submitting, remove API keys, tokens, passwords, private keys, personal information, confidential employer/customer material, private local paths, and sensitive screenshots or log contents. Security vulnerabilities must be reported privately through SECURITY.md instead of a public issue.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: A concise description of the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Exact steps and sanitized inputs
      placeholder: |
        1. Run ...
        2. Execute ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What should have happened
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Python version, OS, PhantomOS version, install method; redact usernames and private paths
      placeholder: Python 3.11, macOS 14, rtnlabs-phantomos 0.1.0, pip install -e .[dev]
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-data check
      options:
        - label: I removed secrets, credentials, personal information, confidential material, and sensitive logs/screenshots from this public report.
          required: true
